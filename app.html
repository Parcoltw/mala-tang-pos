<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>辣極麻辣燙</title>
<style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans TC",sans-serif;color-scheme:light}
*{box-sizing:border-box} body{margin:0;background:#f4f4f4;color:#111} button,input,select{font:inherit}
header{background:#111;color:#fff;padding:12px 14px;display:flex;gap:8px;align-items:center;justify-content:space-between}
header h1{font-size:19px;margin:0}.headBtns{display:flex;gap:7px}
button{border:0;border-radius:11px;padding:10px 12px;font-weight:800;cursor:pointer}.yellow{background:#ffd23f}.ghost{background:#eee}.dark{background:#111;color:#fff}
.layout{display:grid;grid-template-columns:minmax(0,1fr) 370px}.left{padding:10px}.right{background:#fff;border-left:1px solid #ddd;min-height:calc(100vh - 60px);display:flex;flex-direction:column}
.categories{display:flex;gap:7px;overflow-x:auto;padding:2px 0 10px}.categories button{white-space:nowrap;background:#fff;border:1px solid #ccc;border-radius:999px}.categories .active{background:#111;color:#fff}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:9px}.item{background:#fff;border:1px solid #ddd;border-radius:14px;min-height:93px;text-align:left;padding:13px;display:flex;flex-direction:column;justify-content:space-between;box-shadow:0 1px 3px #0001}.item:active{transform:scale(.98)}.itemName{font-size:16px;font-weight:900}.price{font-size:19px;font-weight:950}
.cartHead{padding:13px 14px;border-bottom:1px solid #ddd;font-size:18px;font-weight:900}.cart{flex:1;padding:8px 12px;overflow:auto}.empty{text-align:center;color:#888;padding:28px 8px}
.row{display:grid;grid-template-columns:1fr auto;gap:10px;border-bottom:1px solid #eee;padding:10px 0}.rowName{font-weight:900}.qty{display:flex;gap:7px;align-items:center;margin-top:6px}.qty button{width:31px;height:31px;padding:0;background:#eee}.sum{font-weight:900}
.orderMeta{padding:10px 12px;background:#fff8db;border-bottom:1px solid #eadb9e;font-size:14px;line-height:1.55}.summary{padding:12px;border-top:1px solid #ddd}.total{display:flex;justify-content:space-between;font-size:25px;font-weight:950;margin-bottom:9px}
.cashline{display:grid;grid-template-columns:1fr 1fr;gap:8px}.cashline input{width:100%;padding:10px;border:1px solid #bbb;border-radius:10px;font-size:18px}.change{font-weight:850;margin-top:7px}.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
dialog{border:0;border-radius:16px;width:min(94vw,560px);max-height:90vh;padding:0;box-shadow:0 20px 70px #0006}dialog::backdrop{background:#0008}.modal{padding:16px}.modal h2{margin:0 0 12px}.section{margin:13px 0}.sectionTitle{font-weight:900;margin-bottom:7px}.choices{display:flex;flex-wrap:wrap;gap:7px}.choices label{display:flex;align-items:center;gap:5px;border:1px solid #ccc;border-radius:999px;padding:8px 10px;background:#fff}.choices input{margin:0}
.modal input[type="text"],.modal input[type="number"],.modal select{width:100%;padding:10px;border:1px solid #bbb;border-radius:10px}.modalFoot{display:flex;justify-content:flex-end;gap:8px;margin-top:16px}
.historyTop{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}.stat{background:#f3f3f3;border-radius:12px;padding:12px}.stat b{display:block;font-size:24px;margin-top:3px}
.record{border:1px solid #ddd;border-radius:12px;padding:11px;margin:8px 0}.recordHead{display:flex;justify-content:space-between;gap:8px;font-weight:900}.recordMeta{font-size:13px;color:#555;margin-top:5px}.recordItems{font-size:13px;margin-top:5px;color:#333}.recordBtns{display:flex;gap:7px;margin-top:8px}.recordBtns button{padding:7px 10px}
.warn{font-size:12px;color:#666;margin-top:7px}.hidden{display:none!important}
@media(max-width:820px){html,body{overflow-x:hidden}.layout{display:block}.right{border-left:0;border-top:2px solid #111;min-height:0}.left{padding:9px}.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.item{min-height:88px}header{padding-top:max(12px,env(safe-area-inset-top))}}
</style>
</head>
<body>
<header>
  <h1>辣極麻辣燙</h1>
  <div class="headBtns"><button id="historyBtn" class="ghost">紀錄/統計</button><button id="customBtn" class="yellow">＋商品</button></div>
</header>
<div class="layout">
<main class="left">
  <div class="categories" id="cats"></div>
  <div class="grid" id="grid"></div>
</main>
<aside class="right">
  <div class="cartHead">目前訂單</div>
  <div id="orderMeta" class="orderMeta">尚未設定內用/外帶與辣度</div>
  <div class="cart" id="cart"></div>
  <div class="summary">
    <div class="total"><span>總計</span><span id="total">$0</span></div>
    <div class="cashline"><input id="cash" type="number" inputmode="numeric" min="0" placeholder="收現金"><button id="exact" class="ghost">剛好付清</button></div>
    <div id="change" class="change">找零：$0</div>
    <div class="actions"><button id="clear" class="ghost">清空</button><button id="checkout" class="dark">結帳</button></div>
  </div>
</aside>
</div>

<dialog id="optionsDlg"><div class="modal">
<h2 id="optionsTitle">結帳選項</h2>
<div class="section"><div class="sectionTitle">用餐方式</div><div class="choices">
<label><input type="radio" name="service" value="內用">內用</label>
<label><input type="radio" name="service" value="外帶">外帶</label>
</div></div>
<div class="section"><div class="sectionTitle">辣度</div><div class="choices" id="spiceChoices"></div></div>
<div class="section hidden" id="oilSection"><div class="sectionTitle">去油</div><div class="choices">
<label><input type="radio" name="oil" value="不去油" checked>不去油</label>
<label><input type="radio" name="oil" value="去油">去油</label>
</div></div>
<div id="takeoutSection" class="hidden">
<div class="section"><div class="sectionTitle">碗</div><div class="choices"><label><input type="radio" name="bowl" value="要碗" checked>要碗</label><label><input type="radio" name="bowl" value="不要碗">不要碗</label></div></div>
<div class="section"><div class="sectionTitle">餐具</div><div class="choices"><label><input type="radio" name="utensils" value="要餐具" checked>要餐具</label><label><input type="radio" name="utensils" value="不要餐具">不要餐具</label></div></div>
</div>
<div class="modalFoot"><button id="optionsCancel" class="ghost">取消</button><button id="optionsSave" class="dark">確認</button></div>
</div></dialog>

<dialog id="historyDlg"><div class="modal">
<h2>結帳紀錄 / 統計</h2>
<div class="historyTop"><div class="stat">筆數<b id="statCount">0</b></div><div class="stat">營業額<b id="statRevenue">$0</b></div></div>
<div id="historyList"></div>
<div class="warn">紀錄儲存在目前這台裝置的瀏覽器。清除網站資料會一起被清除。</div>
<div class="modalFoot"><button id="historyClose" class="dark">關閉</button></div>
</div></dialog>

<dialog id="editRecordDlg"><div class="modal">
<h2>修改結帳紀錄</h2>
<div class="section"><div class="sectionTitle">金額</div><input id="editAmount" type="number" min="0"></div>
<div class="section"><div class="sectionTitle">用餐方式</div><select id="editService"><option>內用</option><option>外帶</option></select></div>
<div class="section"><div class="sectionTitle">辣度</div><select id="editSpice"></select></div>
<div class="section"><div class="sectionTitle">備註（可改品項文字）</div><input id="editItems" type="text"></div>
<div class="modalFoot"><button id="editCancel" class="ghost">取消</button><button id="editSave" class="dark">儲存修改</button></div>
</div></dialog>

<dialog id="customDlg"><div class="modal">
<h2>新增自訂商品</h2>
<div class="section"><div class="sectionTitle">分類</div><select id="newCat"></select></div>
<div class="section"><div class="sectionTitle">品名</div><input id="newName" type="text"></div>
<div class="section"><div class="sectionTitle">價格</div><input id="newPrice" type="number" min="0"></div>
<div class="modalFoot"><button id="customCancel" class="ghost">取消</button><button id="customSave" class="dark">新增</button></div>
</div></dialog>

<script>
const DEFAULT_ITEMS=[
["肉類","牛筋",60],["肉類","豬腿肉",55],["肉類","大腸頭",50],["肉類","牛肚",50],["肉類","牛腱",50],["肉類","培根牛肉",50],["肉類","豬肉片",50],["肉類","雞肉片",50],["肉類","紅糟肉",45],["肉類","豬頭皮",45],["肉類","滷雞胗",15],
["蔬菜類","茭白筍",35],["蔬菜類","高麗菜",25],["蔬菜類","大陸妹",25],["蔬菜類","豆芽菜",25],["蔬菜類","青花椰菜",25],["蔬菜類","空心菜",25],["蔬菜類","地瓜葉",25],["蔬菜類","山東白",25],["蔬菜類","金針菇",25],["蔬菜類","生香菇",25],["蔬菜類","杏鮑菇",25],["蔬菜類","秀珍菇",25],["蔬菜類","木耳",25],["蔬菜類","玉米筍",25],["蔬菜類","嫩洋蔥",25],["蔬菜類","絲瓜",25],["蔬菜類","蘿蔔",25],["蔬菜類","茄子",25],["蔬菜類","秋葵",25],["蔬菜類","水蓮",25],["蔬菜類","蓮藕",25],["蔬菜類","茼蒿（冬季）",25],
["火鍋料","芋頭丸（1個）",15],["火鍋料","香菇丸",13],["火鍋料","龍蝦球",13],["火鍋料","墨魚丸",13],["火鍋料","芥末丸",13],["火鍋料","魚豆腐",13],["火鍋料","龍蝦沙拉",13],["火鍋料","煙燻起司",13],["火鍋料","九層花枝",13],["火鍋料","原味麻糬燒",13],["火鍋料","大龍蝦味棒",13],["火鍋料","貢丸",13],["火鍋料","魚餃",13],["火鍋料","魚蛋",13],["火鍋料","燕餃",13],["火鍋料","北海貝",13],["火鍋料","花枝丸",13],["火鍋料","鱈魚條",13],["火鍋料","蛋餃",10],["火鍋料","甜不辣",10],["火鍋料","水晶餃",10],["火鍋料","蟹肉棒",10],
["其它類","德國香腸",30],["其它類","竹輪",25],["其它類","凍豆皮",25],["其它類","小油皮",25],["其它類","凍豆腐",25],["其它類","油條",25],["其它類","麻辣鴨血",25],["其它類","乾豆皮",25],["其它類","家常豆腐",25],["其它類","鳥蛋（3個）",20],["其它類","百葉豆腐",20],["其它類","豬血糕",20],["其它類","花干",20],["其它類","芋粿",20],["其它類","米腸",20],["其它類","魚板",20],["其它類","豆干（3個）",25],["其它類","黑輪",15],["其它類","蒟蒻絲（3個）",15],["其它類","鑫鑫腸（3個）",15],["其它類","年糕條（3個）",15],
["麵類","韓國拉麵",45],["麵類","手工拉麵",40],["麵類","刀削麵",25],["麵類","蔬菜麵",25],["麵類","粿仔條",25],["麵類","蒸煮麵",25],["麵類","意Q麵",25],["麵類","雞絲麵",25],["麵類","鍋燒意麵",25],["麵類","王子麵",20],["麵類","冬粉",20],["麵類","寬冬粉",20],["麵類","烏龍麵",20],
["套餐","牛肉套餐",210],["套餐","豬肉套餐",210],["套餐","雞肉套餐",210],["套餐","鴨血套餐",150],["套餐","豆腐煲套餐",150]
];
const SPICES=["不辣","微微辣","微辣","小辣","中辣","大辣","大辣再辣"];
let items=JSON.parse(localStorage.getItem("posItems")||"null")||DEFAULT_ITEMS;
let records=JSON.parse(localStorage.getItem("posRecords")||"[]");
let cart={},active="全部",pendingOptions=null,editingRecordId=null;

const $=id=>document.getElementById(id), cats=$("cats"), grid=$("grid"), cartEl=$("cart"), cash=$("cash");
function saveRecords(){localStorage.setItem("posRecords",JSON.stringify(records))}
function categories(){return ["全部",...new Set(items.map(x=>x[0]))]}
function renderCats(){cats.innerHTML="";categories().forEach(c=>{let b=document.createElement("button");b.textContent=c;b.className=c===active?"active":"";b.onclick=()=>{active=c;renderCats();renderGrid()};cats.appendChild(b)});$("newCat").innerHTML=categories().filter(x=>x!=="全部").map(x=>`<option>${x}</option>`).join("")}
function renderGrid(){grid.innerHTML="";items.forEach((it,i)=>{if(active!=="全部"&&it[0]!==active)return;let b=document.createElement("button");b.className="item";b.innerHTML=`<span class="itemName">${it[1]}</span><span class="price">$${it[2]}</span>`;b.onclick=()=>{cart[i]=(cart[i]||0)+1;renderCart()};grid.appendChild(b)})}
function total(){return Object.entries(cart).reduce((s,[i,q])=>s+items[i][2]*q,0)}
function cartText(){return Object.entries(cart).map(([i,q])=>`${items[i][1]}×${q}`).join("、")}
function renderCart(){cartEl.innerHTML="";let es=Object.entries(cart);if(!es.length)cartEl.innerHTML='<div class="empty">點商品加入訂單</div>';es.forEach(([i,q])=>{let it=items[i],d=document.createElement("div");d.className="row";d.innerHTML=`<div><div class="rowName">${it[1]}　$${it[2]}</div><div class="qty"><button data-m>−</button><b>${q}</b><button data-p>＋</button></div></div><div class="sum">$${it[2]*q}</div>`;d.querySelector("[data-m]").onclick=()=>{cart[i]--;if(cart[i]<=0)delete cart[i];renderCart()};d.querySelector("[data-p]").onclick=()=>{cart[i]++;renderCart()};cartEl.appendChild(d)});$("total").textContent="$"+total();calcChange();renderMeta()}
function calcChange(){let t=total(),c=Number(cash.value||0);$("change").textContent=c>=t?`找零：$${c-t}`:`尚差：$${t-c}`}
function renderMeta(){if(!pendingOptions){$("orderMeta").textContent="尚未設定內用/外帶與辣度";return}let o=pendingOptions,parts=[o.service,o.spice];if(o.oil)parts.push(o.oil);if(o.service==="外帶")parts.push(o.bowl,o.utensils);$("orderMeta").textContent=parts.join("・")}
cash.oninput=calcChange;$("exact").onclick=()=>{cash.value=total();calcChange()};$("clear").onclick=()=>{cart={};cash.value="";pendingOptions=null;renderCart()};

SPICES.forEach(s=>{let l=document.createElement("label");l.innerHTML=`<input type="radio" name="spice" value="${s}">${s}`;$("spiceChoices").appendChild(l);let o=document.createElement("option");o.textContent=s;$("editSpice").appendChild(o)});
function selected(name){let e=document.querySelector(`input[name="${name}"]:checked`);return e?e.value:null}
function syncOptionVisibility(){let service=selected("service"),spice=selected("spice");$("takeoutSection").classList.toggle("hidden",service!=="外帶");$("oilSection").classList.toggle("hidden",!spice||SPICES.indexOf(spice)<3)}
document.querySelectorAll('input[name="service"],input[name="spice"]').forEach(x=>x.addEventListener("change",syncOptionVisibility));
function openOptions(){document.querySelectorAll('input[name="service"],input[name="spice"]').forEach(x=>x.checked=false);document.querySelector('input[name="oil"][value="不去油"]').checked=true;document.querySelector('input[name="bowl"][value="要碗"]').checked=true;document.querySelector('input[name="utensils"][value="要餐具"]').checked=true;if(pendingOptions){let q=v=>document.querySelector(`input[value="${v}"]`);[pendingOptions.service,pendingOptions.spice,pendingOptions.oil,pendingOptions.bowl,pendingOptions.utensils].filter(Boolean).forEach(v=>{let e=q(v);if(e)e.checked=true})}syncOptionVisibility();$("optionsDlg").showModal()}
$("orderMeta").onclick=openOptions;$("optionsCancel").onclick=()=>$("optionsDlg").close();
$("optionsSave").onclick=()=>{let service=selected("service"),spice=selected("spice");if(!service||!spice){alert("請選擇內用/外帶與辣度");return}let oil=SPICES.indexOf(spice)>=3?selected("oil"):null;pendingOptions={service,spice,oil,bowl:service==="外帶"?selected("bowl"):null,utensils:service==="外帶"?selected("utensils"):null};renderMeta();$("optionsDlg").close()};

$("checkout").onclick=()=>{if(!Object.keys(cart).length){alert("目前沒有商品");return}let c=Number(cash.value||0);if(c&&c<total()){alert("收款金額不足");return}if(!pendingOptions){openOptions();return}
let rec={id:Date.now(),time:new Date().toISOString(),amount:total(),service:pendingOptions.service,spice:pendingOptions.spice,oil:pendingOptions.oil||"",bowl:pendingOptions.bowl||"",utensils:pendingOptions.utensils||"",items:cartText()};records.unshift(rec);saveRecords();alert(`結帳完成\n總計：$${rec.amount}${c?`\n找零：$${c-rec.amount}`:""}`);cart={};cash.value="";pendingOptions=null;renderCart()};

function localTime(s){return new Date(s).toLocaleString("zh-TW",{hour12:false})}
function renderHistory(){let rev=records.reduce((s,r)=>s+Number(r.amount||0),0);$("statCount").textContent=records.length;$("statRevenue").textContent="$"+rev;$("historyList").innerHTML=records.length?"":'<div class="empty">尚無結帳紀錄</div>';records.forEach(r=>{let d=document.createElement("div");d.className="record";d.innerHTML=`<div class="recordHead"><span>#${r.id.toString().slice(-5)}　${r.service}・${r.spice}</span><span>$${r.amount}</span></div><div class="recordMeta">${localTime(r.time)}${r.oil?"・"+r.oil:""}${r.bowl?"・"+r.bowl:""}${r.utensils?"・"+r.utensils:""}</div><div class="recordItems">${r.items||""}</div><div class="recordBtns"><button class="ghost" data-edit>修改</button><button class="ghost" data-del>刪除</button></div>`;d.querySelector("[data-edit]").onclick=()=>openEdit(r.id);d.querySelector("[data-del]").onclick=()=>{if(confirm("確定刪除這筆結帳紀錄？")){records=records.filter(x=>x.id!==r.id);saveRecords();renderHistory()}};$("historyList").appendChild(d)})}
$("historyBtn").onclick=()=>{renderHistory();$("historyDlg").showModal()};$("historyClose").onclick=()=>$("historyDlg").close();

function openEdit(id){let r=records.find(x=>x.id===id);if(!r)return;editingRecordId=id;$("editAmount").value=r.amount;$("editService").value=r.service;$("editSpice").value=r.spice;$("editItems").value=r.items||"";$("editRecordDlg").showModal()}
$("editCancel").onclick=()=>$("editRecordDlg").close();
$("editSave").onclick=()=>{let r=records.find(x=>x.id===editingRecordId);if(!r)return;let amt=Number($("editAmount").value);if(!Number.isFinite(amt)||amt<0){alert("金額不正確");return}r.amount=amt;r.service=$("editService").value;r.spice=$("editSpice").value;r.items=$("editItems").value.trim();saveRecords();$("editRecordDlg").close();renderHistory()};

$("customBtn").onclick=()=>$("customDlg").showModal();$("customCancel").onclick=()=>$("customDlg").close();$("customSave").onclick=()=>{let cat=$("newCat").value,name=$("newName").value.trim(),price=Number($("newPrice").value);if(!name||!Number.isFinite(price)||price<0){alert("請輸入正確品名與價格");return}items.push([cat,name,price]);localStorage.setItem("posItems",JSON.stringify(items));$("newName").value="";$("newPrice").value="";renderCats();renderGrid();$("customDlg").close()};

renderCats();renderGrid();renderCart();
</script>
</body></html>
