<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>辣極麻辣燙永和店</title>
<style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans TC",sans-serif;color-scheme:light}
*{box-sizing:border-box}html,body{margin:0;padding:0;background:#f4f4f4;color:#111}button,input,select{font:inherit}
body{min-height:100dvh}
header{background:#111;color:#fff;padding:12px 14px;display:flex;gap:8px;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:5}
header h1{font-size:20px;margin:0}.headBtns{display:flex;gap:8px;flex-wrap:wrap}
button{border:0;border-radius:12px;padding:10px 12px;font-weight:800;cursor:pointer}
button:disabled{opacity:.45;cursor:not-allowed}
.yellow{background:#ffd23f}.ghost{background:#eee}.dark{background:#111;color:#fff}.red{background:#dc2626;color:#fff}.green{background:#16a34a;color:#fff}
.layout{display:grid;grid-template-columns:minmax(0,1fr) 390px;min-height:calc(100dvh - 60px)}
.left{padding:10px;overflow:auto}.right{background:#fff;border-left:1px solid #ddd;display:flex;flex-direction:column}
.categories,.bowlTabs{display:flex;gap:7px;overflow-x:auto;padding:4px 0 10px}.categories button,.bowlTabs button{white-space:nowrap;background:#fff;border:1px solid #ccc;border-radius:999px;flex:0 0 auto}
.categories .active,.bowlTabs .active{background:#111;color:#fff;border-color:#111}
.toolRow{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:9px}.item{background:#fff;border:1px solid #ddd;border-radius:14px;min-height:93px;text-align:left;padding:13px;display:flex;flex-direction:column;justify-content:space-between;box-shadow:0 1px 3px #0001}.item:active{transform:scale(.98)}.itemName{font-size:16px;font-weight:900}.price{font-size:19px;font-weight:950}
.sideHead{padding:13px 14px;border-bottom:1px solid #ddd;font-size:18px;font-weight:900}
.orderMeta{padding:10px 12px;background:#fff8db;border-bottom:1px solid #eadb9e;font-size:14px;line-height:1.55}
.cart{flex:1;padding:8px 12px;overflow:auto}.empty{text-align:center;color:#888;padding:28px 8px}
.bowlBlock{border:1px solid #ddd;border-radius:12px;padding:10px;margin:10px 0;background:#fff}.bowlBlock.active{border-color:#111;box-shadow:0 0 0 2px #1111}.bowlBlockHead{display:flex;justify-content:space-between;gap:8px;align-items:flex-start;font-weight:900}.bowlSub{font-size:13px;color:#555;margin-top:4px}.row{display:grid;grid-template-columns:1fr auto;gap:10px;border-bottom:1px solid #eee;padding:8px 0}.row:last-child{border-bottom:0}.rowName{font-weight:900}.qty{display:flex;gap:7px;align-items:center;margin-top:6px}.qty button{width:31px;height:31px;padding:0;background:#eee}.sum{font-weight:900}
.summary{padding:12px;border-top:1px solid #ddd}.total{display:flex;justify-content:space-between;font-size:26px;font-weight:950;margin-bottom:9px}.cashline{display:grid;grid-template-columns:1fr 1fr;gap:8px}.cashline input{width:100%;padding:10px;border:1px solid #bbb;border-radius:10px;font-size:18px}.change{font-weight:850;margin-top:7px}.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
dialog{border:0;border-radius:16px;width:min(96vw,720px);max-height:92vh;padding:0;box-shadow:0 20px 70px #0006}dialog::backdrop{background:#0008}.modal{padding:16px}.modal h2{margin:0 0 12px}.section{margin:13px 0}.sectionTitle{font-weight:900;margin-bottom:7px}
.optionGrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}.optionGrid.spiceGrid{grid-template-columns:repeat(4,minmax(0,1fr))}
.optionGrid label{position:relative;display:flex;align-items:center;justify-content:center;text-align:center;min-height:52px;border:1.5px solid #bbb;border-radius:10px;background:#fff;font-weight:900;padding:8px;cursor:pointer;user-select:none}.optionGrid label:has(input:checked){background:#111;color:#fff;border-color:#111}.optionGrid input{position:absolute;opacity:0;pointer-events:none}
.modal input[type="text"],.modal input[type="number"],.modal select{width:100%;padding:10px;border:1px solid #bbb;border-radius:10px}.modalFoot{display:flex;justify-content:flex-end;gap:8px;margin-top:16px;flex-wrap:wrap}
.historyTop{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}.stat{background:#f3f3f3;border-radius:12px;padding:12px}.stat b{display:block;font-size:24px;margin-top:3px}.record{border:1px solid #ddd;border-radius:12px;padding:11px;margin:8px 0}.recordHead{display:flex;justify-content:space-between;gap:8px;font-weight:900}.recordMeta{font-size:13px;color:#555;margin-top:5px}.recordItems{font-size:13px;margin-top:5px;color:#333;white-space:pre-line}.recordBtns{display:flex;gap:7px;flex-wrap:wrap;margin-top:8px}.recordBtns button{padding:7px 10px}.warn{font-size:12px;color:#666;margin-top:7px}.hidden{display:none!important}.small{font-size:13px;color:#666}
@media(max-width:820px){.layout{display:block}.right{border-left:0;border-top:2px solid #111}.left{padding:9px}.grid{grid-template-columns:repeat(2,minmax(0,1fr))}header{padding-top:max(12px,env(safe-area-inset-top))}.optionGrid,.optionGrid.spiceGrid{grid-template-columns:repeat(3,minmax(0,1fr))}}
</style>
</head>
<body>
<header><h1>辣極麻辣燙永和店</h1><div class="headBtns"><button id="historyBtn" class="ghost">紀錄/統計</button><button id="customBtn" class="yellow">＋商品</button></div></header>
<div class="layout"><main class="left"><div class="bowlTabs" id="bowlTabs"></div><div class="toolRow"><button id="addBowlBtn" class="green">＋ 新增一碗</button><button id="setOptionsBtn" class="ghost">設定本碗選項</button><button id="removeBowlBtn" class="ghost">刪除本碗</button></div><div class="categories" id="cats"></div><div class="grid" id="grid"></div></main><aside class="right"><div class="sideHead">目前訂單</div><div id="orderMeta" class="orderMeta">可先點第一碗食材 → 設定辣度/需求 → 再新增下一碗</div><div class="cart" id="cart"></div><div class="summary"><div class="total"><span>總計</span><span id="total">$0</span></div><div class="cashline"><input id="cash" type="number" inputmode="numeric" min="0" placeholder="收現金"><button id="exact" class="ghost">剛好付清</button></div><div id="change" class="change">找零：$0</div><div class="actions"><button id="clear" class="ghost">清空整單</button><button id="checkout" class="dark">結帳</button></div></div></aside></div>
<dialog id="optionsDlg"><div class="modal"><h2>本碗選項</h2><div class="small">這些設定只會套用到目前這一碗。</div><div class="section"><div class="sectionTitle">用餐方式</div><div class="optionGrid"><label><input type="radio" name="service" value="內用">內用</label><label><input type="radio" name="service" value="外帶">外帶</label></div></div><div class="section"><div class="sectionTitle">辣度</div><div class="optionGrid spiceGrid" id="spiceChoices"></div></div><div class="section"><div class="sectionTitle">其他需求（可複選）</div><div class="optionGrid" id="quickChoices"></div></div><div class="modalFoot"><button id="optionsCancel" class="ghost">取消</button><button id="optionsSave" class="dark">儲存本碗</button></div></div></dialog>
<dialog id="historyDlg"><div class="modal"><h2>結帳紀錄 / 統計</h2><div class="historyTop"><div class="stat">筆數<b id="statCount">0</b></div><div class="stat">營業額<b id="statRevenue">$0</b></div></div><div id="historyList"></div><div class="warn">紀錄儲存在目前這台裝置的瀏覽器。清除網站資料會一起被清除。</div><div class="modalFoot"><button id="historyClose" class="dark">關閉</button></div></div></dialog>
<dialog id="customDlg"><div class="modal"><h2>新增自訂商品</h2><div class="section"><div class="sectionTitle">分類</div><select id="newCat"></select></div><div class="section"><div class="sectionTitle">品名</div><input id="newName" type="text"></div><div class="section"><div class="sectionTitle">價格</div><input id="newPrice" type="number" min="0"></div><div class="modalFoot"><button id="customCancel" class="ghost">取消</button><button id="customSave" class="dark">新增</button></div></div></dialog>
<script>
const SPICES=['不辣','微微辣','微辣','小辣','中辣','大辣','大辣再辣'];
const QUICK_OPTIONS=['湯少','湯多','去油','盒裝湯裡','不要碗','不要餐具','麵分開','辣另包','水煮','自備碗','湯料分開','麵放一起','辣油各半'];
const CONFLICTS={'湯少':['湯多'],'湯多':['湯少'],'麵分開':['麵放一起'],'麵放一起':['麵分開'],'盒裝湯裡':['湯料分開'],'湯料分開':['盒裝湯裡'],'辣另包':['辣油各半'],'辣油各半':['辣另包'],'不要碗':['自備碗'],'自備碗':['不要碗']};
const DEFAULT_ITEMS=[["肉類","牛筋",60],["肉類","豬腿肉",55],["肉類","大腸頭",50],["肉類","牛肚",50],["肉類","牛腱",50],["肉類","培根牛肉",50],["肉類","豬肉片",50],["肉類","雞肉片",50],["肉類","紅糟肉",45],["肉類","豬頭皮",45],["肉類","滷雞胗",15],["蔬菜類","茭白筍",35],["蔬菜類","高麗菜",25],["蔬菜類","大陸妹",25],["蔬菜類","豆芽菜",25],["蔬菜類","青花椰菜",25],["蔬菜類","空心菜",25],["蔬菜類","地瓜葉",25],["蔬菜類","山東白",25],["蔬菜類","金針菇",25],["蔬菜類","生香菇",25],["蔬菜類","杏鮑菇",25],["蔬菜類","秀珍菇",25],["蔬菜類","木耳",25],["蔬菜類","玉米筍",25],["蔬菜類","嫩洋蔥",25],["蔬菜類","絲瓜",25],["蔬菜類","蘿蔔",25],["蔬菜類","茄子",25],["蔬菜類","秋葵",25],["蔬菜類","水蓮",25],["蔬菜類","蓮藕",25],["蔬菜類","茼蒿（冬季）",25],["火鍋料","芋頭丸（1個）",15],["火鍋料","香菇丸",13],["火鍋料","龍蝦球",13],["火鍋料","墨魚丸",13],["火鍋料","芥末丸",13],["火鍋料","魚豆腐",13],["火鍋料","龍蝦沙拉",13],["火鍋料","煙燻起司",13],["火鍋料","九層花枝",13],["火鍋料","原味麻糬燒",13],["火鍋料","大龍蝦味棒",13],["火鍋料","貢丸",13],["火鍋料","魚餃",13],["火鍋料","魚蛋",13],["火鍋料","燕餃",13],["火鍋料","北海貝",13],["火鍋料","花枝丸",13],["火鍋料","鱈魚條",13],["火鍋料","蛋餃",10],["火鍋料","甜不辣",10],["火鍋料","水晶餃",10],["火鍋料","蟹肉棒",10],["其它類","德國香腸",30],["其它類","竹輪",25],["其它類","凍豆皮",25],["其它類","小油皮",25],["其它類","凍豆腐",25],["其它類","油條",25],["其它類","麻辣鴨血",25],["其它類","乾豆皮",25],["其它類","家常豆腐",25],["其它類","鳥蛋（3個）",20],["其它類","百葉豆腐",20],["其它類","豬血糕",20],["其它類","花干",20],["其它類","芋粿",20],["其它類","米腸",20],["其它類","魚板",20],["其它類","豆干（3個）",25],["其它類","黑輪",15],["其它類","蒟蒻絲（3個）",15],["其它類","鑫鑫腸（3個）",15],["其它類","年糕條（3個）",15],["麵類","韓國拉麵",45],["麵類","手工拉麵",40],["麵類","刀削麵",25],["麵類","蔬菜麵",25],["麵類","粿仔條",25],["麵類","蒸煮麵",25],["麵類","意Q麵",25],["麵類","雞絲麵",25],["麵類","鍋燒意麵",25],["麵類","王子麵",20],["麵類","冬粉",20],["麵類","寬冬粉",20],["麵類","烏龍麵",20],["套餐","牛肉套餐",210],["套餐","豬肉套餐",210],["套餐","雞肉套餐",210],["套餐","鴨血套餐",150],["套餐","豆腐煲套餐",150]];
let items=JSON.parse(localStorage.getItem('posItems')||'null')||DEFAULT_ITEMS;
let records=JSON.parse(localStorage.getItem('posRecords')||'[]');
let bowls=[{items:{},service:'',spice:'',extras:[]}],currentBowlIndex=0,activeCat='全部';
const $=id=>document.getElementById(id);
const categories=()=>['全部',...new Set(items.map(x=>x[0]))];
const bowlTotal=b=>Object.entries(b.items).reduce((s,[i,q])=>s+items[i][2]*q,0);
const orderTotal=()=>bowls.reduce((s,b)=>s+bowlTotal(b),0);
const bowlCount=b=>Object.values(b.items).reduce((s,q)=>s+q,0);
const validBowls=()=>bowls.filter(b=>bowlCount(b)>0);
function saveRecords(){localStorage.setItem('posRecords',JSON.stringify(records))}
function dayKey(v){const d=v instanceof Date?v:new Date(v);return [d.getFullYear(),String(d.getMonth()+1).padStart(2,'0'),String(d.getDate()).padStart(2,'0')].join('-')}
function nextOrderNo(){const today=dayKey(new Date());return records.filter(r=>dayKey(r.time)===today).length+1}
function renderCats(){cats.innerHTML='';categories().forEach(c=>{const b=document.createElement('button');b.textContent=c;b.className=c===activeCat?'active':'';b.onclick=()=>{activeCat=c;renderCats();renderGrid()};cats.appendChild(b)});newCat.innerHTML=categories().filter(x=>x!=='全部').map(x=>`<option>${x}</option>`).join('')}
function renderGrid(){grid.innerHTML='';items.forEach((it,i)=>{if(activeCat!=='全部'&&it[0]!==activeCat)return;const b=document.createElement('button');b.className='item';b.innerHTML=`<span class="itemName">${it[1]}</span><span class="price">$${it[2]}</span>`;b.onclick=()=>{const bowl=bowls[currentBowlIndex];bowl.items[i]=(bowl.items[i]||0)+1;renderAll()};grid.appendChild(b)})}
function renderBowlTabs(){bowlTabs.innerHTML='';bowls.forEach((b,i)=>{const btn=document.createElement('button');btn.className=i===currentBowlIndex?'active':'';btn.textContent=`第 ${i+1} 碗${bowlCount(b)?' ('+bowlCount(b)+')':''}`;btn.onclick=()=>{currentBowlIndex=i;renderAll()};bowlTabs.appendChild(btn)})}
function renderCart(){cart.innerHTML='';const filled=validBowls();if(!filled.length)cart.innerHTML='<div class="empty">點商品加入目前這一碗</div>';filled.forEach((b,di)=>{const ri=bowls.indexOf(b),block=document.createElement('div');block.className='bowlBlock'+(ri===currentBowlIndex?' active':'');const opts=[b.spice,...b.extras].filter(Boolean).join('、');block.innerHTML=`<div class="bowlBlockHead"><div>第 ${di+1} 碗<div class="bowlSub">${b.service||'未選用餐'}・${b.spice||'未選辣度'}${opts?'<br>● '+opts:''}</div></div><div>$${bowlTotal(b)}</div></div>`;Object.entries(b.items).forEach(([i,q])=>{const r=document.createElement('div');r.className='row';r.innerHTML=`<div><div class="rowName">${items[i][1]}　$${items[i][2]}</div><div class="qty"><button>−</button><b>${q}</b><button>＋</button></div></div><div class="sum">$${items[i][2]*q}</div>`;const bs=r.querySelectorAll('button');bs[0].onclick=e=>{e.stopPropagation();b.items[i]--;if(b.items[i]<=0)delete b.items[i];renderAll()};bs[1].onclick=e=>{e.stopPropagation();b.items[i]++;renderAll()};block.appendChild(r)});block.onclick=()=>{currentBowlIndex=ri;renderAll()};cart.appendChild(block)});total.textContent='$'+orderTotal();calcChange();renderMeta();removeBowlBtn.disabled=bowls.length<=1}
function renderMeta(){const f=validBowls();orderMeta.innerHTML=f.length?f.map((b,i)=>`第${i+1}碗・${b.service||'未選用餐'}・${b.spice||'未選辣度'}${b.extras.length?'・'+b.extras.join('・'):''}`).join('<br>'):'可先點第一碗食材 → 設定辣度/需求 → 再新增下一碗'}
function calcChange(){const t=orderTotal(),c=Number(cash.value||0);change.textContent=c>=t?`找零：$${c-t}`:`尚差：$${t-c}`}
function renderAll(){renderBowlTabs();renderCart()}
SPICES.forEach(s=>{const l=document.createElement('label');l.innerHTML=`<input type="radio" name="spice" value="${s}">${s}`;spiceChoices.appendChild(l)});QUICK_OPTIONS.forEach(v=>{const l=document.createElement('label');l.innerHTML=`<input type="checkbox" name="quick" value="${v}">${v}`;quickChoices.appendChild(l)});quickChoices.addEventListener('change',e=>{const t=e.target;if(!t.checked)return;(CONFLICTS[t.value]||[]).forEach(v=>{const q=quickChoices.querySelector(`input[value="${v}"]`);if(q)q.checked=false})});
function pick(name){return document.querySelector(`input[name="${name}"]:checked`)?.value||''}function picks(name){return [...document.querySelectorAll(`input[name="${name}"]:checked`)].map(x=>x.value)}
function openOptions(){const b=bowls[currentBowlIndex];document.querySelectorAll('input[name="service"],input[name="spice"],input[name="quick"]').forEach(x=>x.checked=false);if(b.service)document.querySelector(`input[name="service"][value="${b.service}"]`).checked=true;if(b.spice)document.querySelector(`input[name="spice"][value="${b.spice}"]`).checked=true;b.extras.forEach(v=>{const q=quickChoices.querySelector(`input[value="${v}"]`);if(q)q.checked=true});optionsDlg.showModal()}
optionsSave.onclick=()=>{const b=bowls[currentBowlIndex],service=pick('service'),spice=pick('spice');if(!service||!spice){alert('請選擇用餐方式與辣度');return}b.service=service;b.spice=spice;b.extras=picks('quick');optionsDlg.close();renderAll()};optionsCancel.onclick=()=>optionsDlg.close();
addBowlBtn.onclick=()=>{if(!bowlCount(bowls[currentBowlIndex])){alert('請先點目前這一碗的食材');return}bowls.push({items:{},service:'',spice:'',extras:[]});currentBowlIndex=bowls.length-1;renderAll()};setOptionsBtn.onclick=()=>{if(!bowlCount(bowls[currentBowlIndex])){alert('這一碗還沒有商品');return}openOptions()};removeBowlBtn.onclick=()=>{if(bowls.length<=1)return;bowls.splice(currentBowlIndex,1);currentBowlIndex=Math.max(0,Math.min(currentBowlIndex,bowls.length-1));renderAll()};clear.onclick=()=>{bowls=[{items:{},service:'',spice:'',extras:[]}];currentBowlIndex=0;cash.value='';renderAll()};cash.oninput=calcChange;exact.onclick=()=>{cash.value=orderTotal();calcChange()};
function printReceipt(rec){const no=String(rec.orderNo).padStart(3,'0'),dt=new Date(rec.time),date=dt.toLocaleDateString('zh-TW'),time=dt.toLocaleTimeString('zh-TW',{hour:'2-digit',minute:'2-digit',hour12:false});const groups=rec.bowls.map(b=>{const rows=b.lines.map(x=>`<div class="item"><span>${x.name}</span><span class="qty">${x.qty}</span><span class="money">${x.subtotal}</span></div>`).join('');const note=[b.spice,...b.extras].filter(Boolean).join('、');return `<div>${rows}${note?`<div class="note">● ${note}</div>`:''}</div>`}).join('<div class="gap"></div>');const w=window.open('','_blank');w.document.write(`<!doctype html><html><head><meta charset="utf-8"><style>@page{size:80mm auto;margin:2.5mm}body{font-family:sans-serif;width:75mm;margin:auto}.shop{text-align:center;font-size:20px;font-weight:900}.ord{font-size:24px;font-weight:900}.dt{display:flex;justify-content:space-between;font-size:12px}.head,.item{display:grid;grid-template-columns:1fr 9mm 16mm}.qty{text-align:center}.money{text-align:right}.note{font-weight:700;padding:2mm 0}.gap{border-top:1px dotted #999;margin:1.5mm 0}.dash{border-top:1px dashed #000;margin:2mm 0}.grand{display:flex;justify-content:space-between;font-size:26px;font-weight:900}</style></head><body><div class="shop">辣極麻辣燙永和店</div><div class="ord">${rec.bowls.length>1?'併單':'訂單'}號：${no}</div><div class="dt"><span>${date}</span><span>${time}</span></div><div class="dash"></div><div class="head"><b>商品名稱</b><b>數量</b><b>金額</b></div><div class="dash"></div>${groups}<div class="dash"></div><div class="grand"><span>總計</span><span>${rec.amount}元</span></div><script>onload=()=>setTimeout(()=>print(),200)<\/script></body></html>`);w.document.close()}
checkout.onclick=()=>{const f=validBowls();if(!f.length){alert('目前沒有商品');return}for(let i=0;i<f.length;i++){if(!f[i].service||!f[i].spice){currentBowlIndex=bowls.indexOf(f[i]);renderAll();alert(`第 ${i+1} 碗尚未設定用餐方式或辣度`);openOptions();return}}const t=orderTotal(),c=Number(cash.value||0);if(c&&c<t){alert('收款金額不足');return}const rec={id:Date.now(),orderNo:nextOrderNo(),time:new Date().toISOString(),amount:t,itemCount:f.reduce((s,b)=>s+bowlCount(b),0),cash:c||0,change:c?c-t:0,bowls:f.map(b=>({service:b.service,spice:b.spice,extras:b.extras,lines:Object.entries(b.items).map(([i,q])=>({name:items[i][1],qty:q,subtotal:items[i][2]*q}))}))};records.unshift(rec);saveRecords();printReceipt(rec);bowls=[{items:{},service:'',spice:'',extras:[]}];currentBowlIndex=0;cash.value='';renderAll()};
historyBtn.onclick=()=>{statCount.textContent=records.length;statRevenue.textContent='$'+records.reduce((s,r)=>s+Number(r.amount||0),0);historyList.innerHTML='';records.slice().reverse().forEach(r=>{const d=document.createElement('div');d.className='record';d.innerHTML=`<div class="recordHead"><span>#${String(r.orderNo||0).padStart(3,'0')}　${r.bowls?.length||1}碗</span><span>$${r.amount}</span></div><div class="recordBtns"><button class="dark">重印</button></div>`;d.querySelector('button').onclick=()=>printReceipt(r);historyList.prepend(d)});historyDlg.showModal()};historyClose.onclick=()=>historyDlg.close();customBtn.onclick=()=>customDlg.showModal();customCancel.onclick=()=>customDlg.close();customSave.onclick=()=>{const name=newName.value.trim(),price=Number(newPrice.value);if(!name||!Number.isFinite(price)||price<0){alert('請輸入正確品名與價格');return}items.push([newCat.value,name,price]);localStorage.setItem('posItems',JSON.stringify(items));newName.value='';newPrice.value='';renderCats();renderGrid();customDlg.close()};
renderCats();renderGrid();renderAll();
</script>
