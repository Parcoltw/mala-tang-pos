<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>麻辣燙臨時 POS</title>
<style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans TC",sans-serif;color-scheme:light}
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:#f4f4f4;color:#111;overflow-x:hidden}
body{min-height:100dvh}
header{background:#111;color:#fff;padding:12px 14px;display:flex;gap:10px;align-items:center;justify-content:space-between}
header h1{font-size:18px;margin:0}
header button,.toolbar button,.cart-actions button,.modal button{border:0;border-radius:10px;padding:10px 12px;font-weight:700;cursor:pointer}
header button{background:#ffcf33}
.layout{display:grid;grid-template-columns:minmax(0,1fr) 360px}
.left{padding:12px;overflow:auto}
.categories{display:flex;gap:8px;overflow-x:auto;padding:0 0 10px;margin:0;background:#f4f4f4}
.categories button{white-space:nowrap;border:1px solid #ccc;background:white;border-radius:999px;padding:9px 14px;font-weight:700;flex:0 0 auto}
.categories button.active{background:#111;color:#fff;border-color:#111}
.toolbar{display:flex;gap:8px;margin:0 0 10px}
.toolbar button{background:white;border:1px solid #ccc}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px}
.item{background:white;border:1px solid #ddd;border-radius:14px;padding:14px;min-height:96px;text-align:left;cursor:pointer;display:flex;flex-direction:column;justify-content:space-between;box-shadow:0 1px 3px #0000000d}
.item:active{transform:scale(.98)}
.item .name{font-size:17px;font-weight:800}
.item .price{font-size:19px;font-weight:900;margin-top:10px}
.right{background:#fff;border-left:1px solid #ddd;display:flex;flex-direction:column;min-height:calc(100dvh - 58px)}
.cart-head{padding:14px;border-bottom:1px solid #ddd;font-size:18px;font-weight:900}
.cart{flex:1;overflow:auto;padding:8px 12px}
.empty{color:#888;text-align:center;padding:30px 10px}
.row{display:grid;grid-template-columns:1fr auto;gap:10px;padding:11px 0;border-bottom:1px solid #eee}
.row .name{font-weight:800}
.controls{display:flex;align-items:center;gap:7px;margin-top:6px}
.controls button{width:30px;height:30px;border:0;border-radius:8px;font-size:18px}
.row .sum{font-weight:900}
.summary{border-top:1px solid #ddd;padding:12px}
.total{display:flex;justify-content:space-between;font-size:25px;font-weight:950;margin-bottom:10px}
.cashline{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.cashline input{width:100%;font-size:18px;padding:10px;border:1px solid #bbb;border-radius:10px}
.change{margin-top:8px;font-size:17px;font-weight:800}
.cart-actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.clear{background:#eee}.checkout{background:#111;color:white}
dialog{border:0;border-radius:16px;max-width:520px;width:min(92vw,520px);padding:0;box-shadow:0 20px 60px #0005}
dialog::backdrop{background:#0008}
.modal{padding:18px}
.modal h2{margin-top:0}
.modal label{display:block;font-weight:800;margin:10px 0 5px}
.modal input,.modal select{width:100%;padding:10px;border:1px solid #bbb;border-radius:10px;font-size:16px}
.modal .actions{display:flex;justify-content:flex-end;gap:8px;margin-top:16px}
.small{font-size:13px;color:#666}
@media(max-width:820px){
  header{position:static!important;top:auto!important}
  .layout{display:block!important;min-height:0!important}
  .left{padding:10px!important;overflow:visible!important;min-height:0!important}
  .categories{position:static!important;top:auto!important;left:auto!important;right:auto!important;transform:none!important;margin:0 0 10px!important;padding:0 0 4px!important;min-height:0!important;height:auto!important;z-index:auto!important}
  .toolbar{position:static!important;margin:0 0 10px!important}
  .right{position:static!important;top:auto!important;height:auto!important;min-height:0!important;border-left:0;border-top:2px solid #111}
  .grid{grid-template-columns:repeat(3,minmax(0,1fr))}
  .item{min-height:88px;padding:11px}
  .item .name{font-size:15px}.item .price{font-size:17px}
}
@media(max-width:500px){
  header{padding-top:max(12px,env(safe-area-inset-top))}
  .grid{grid-template-columns:repeat(2,minmax(0,1fr))}
  .categories button{padding:9px 13px}
  .toolbar button{font-size:14px;padding:8px 10px}
}
</style>
</head>
<body>
<header>
  <h1>麻辣燙臨時 POS</h1>
  <button id="editBtn">＋ 自訂商品</button>
</header>
<div class="layout">
  <main class="left">
    <div class="categories" id="cats"></div>
    <div class="toolbar"><button id="resetMenu">恢復預設菜單</button></div>
    <div class="grid" id="grid"></div>
  </main>
  <aside class="right">
    <div class="cart-head">目前訂單</div>
    <div class="cart" id="cart"></div>
    <div class="summary">
      <div class="total"><span>總計</span><span id="total">$0</span></div>
      <div class="cashline">
        <input id="cash" inputmode="numeric" type="number" min="0" placeholder="收現金">
        <button id="exact" style="border:0;border-radius:10px;font-weight:800">剛好付清</button>
      </div>
      <div class="change" id="change">找零：$0</div>
      <div class="cart-actions">
        <button class="clear" id="clear">清空</button>
        <button class="checkout" id="checkout">結帳</button>
      </div>
    </div>
  </aside>
</div>
<dialog id="dlg"><div class="modal"><h2>新增自訂商品</h2><div class="small">會儲存在這台裝置的瀏覽器裡。</div><label>分類</label><select id="newCat"></select><label>品名</label><input id="newName" placeholder="例如：加辣"><label>價格</label><input id="newPrice" type="number" inputmode="numeric" min="0" placeholder="例如：10"><div class="actions"><button id="cancel">取消</button><button id="save" style="background:#111;color:#fff">新增</button></div></div></dialog>
<script>
const DEFAULT_ITEMS=[["肉類","牛筋",60],["肉類","豬腿肉",55],["肉類","大腸頭",50],["肉類","牛肚",50],["肉類","牛腱",50],["肉類","培根牛肉",50],["肉類","豬肉片",50],["肉類","雞肉片",50],["肉類","紅糟肉",45],["肉類","豬頭皮",45],["肉類","滷雞胗",15],["蔬菜類","茭白筍",35],["蔬菜類","高麗菜",25],["蔬菜類","大陸妹",25],["蔬菜類","豆芽菜",25],["蔬菜類","青花椰菜",25],["蔬菜類","空心菜",25],["蔬菜類","地瓜葉",25],["蔬菜類","山東白",25],["蔬菜類","金針菇",25],["蔬菜類","生香菇",25],["蔬菜類","杏鮑菇",25],["蔬菜類","秀珍菇",25],["蔬菜類","木耳",25],["蔬菜類","玉米筍",25],["蔬菜類","嫩洋蔥",25],["蔬菜類","絲瓜",25],["蔬菜類","蘿蔔",25],["蔬菜類","茄子",25],["蔬菜類","秋葵",25],["蔬菜類","水蓮",25],["蔬菜類","蓮藕",25],["蔬菜類","茼蒿（冬季）",25],["火鍋料","芋頭丸（1個）",15],["火鍋料","香菇丸",13],["火鍋料","龍蝦球",13],["火鍋料","墨魚丸",13],["火鍋料","芥末丸",13],["火鍋料","魚豆腐",13],["火鍋料","龍蝦沙拉",13],["火鍋料","煙燻起司",13],["火鍋料","九層花枝",13],["火鍋料","原味麻糬燒",13],["火鍋料","大龍蝦味棒",13],["火鍋料","貢丸",13],["火鍋料","魚餃",13],["火鍋料","魚蛋",13],["火鍋料","燕餃",13],["火鍋料","北海貝",13],["火鍋料","花枝丸",13],["火鍋料","鱈魚條",13],["火鍋料","蛋餃",10],["火鍋料","甜不辣",10],["火鍋料","水晶餃",10],["火鍋料","蟹肉棒",10],["其它類","德國香腸",30],["其它類","竹輪",25],["其它類","凍豆皮",25],["其它類","小油皮",25],["其它類","凍豆腐",25],["其它類","油條",25],["其它類","麻辣鴨血",25],["其它類","乾豆皮",25],["其它類","家常豆腐",25],["其它類","鳥蛋（3個）",20],["其它類","百葉豆腐",20],["其它類","豬血糕",20],["其它類","花干",20],["其它類","芋粿",20],["其它類","米腸",20],["其它類","魚板",20],["其它類","豆干（3個）",25],["其它類","黑輪",15],["其它類","蒟蒻絲（3個）",15],["其它類","鑫鑫腸（3個）",15],["其它類","年糕條（3個）",15],["麵類","韓國拉麵",45],["麵類","手工拉麵",40],["麵類","刀削麵",25],["麵類","蔬菜麵",25],["麵類","粿仔條",25],["麵類","蒸煮麵",25],["麵類","意Q麵",25],["麵類","雞絲麵",25],["麵類","鍋燒意麵",25],["麵類","王子麵",20],["麵類","冬粉",20],["麵類","寬冬粉",20],["麵類","烏龍麵",20],["套餐","牛肉套餐",210],["套餐","豬肉套餐",210],["套餐","雞肉套餐",210],["套餐","鴨血套餐",150],["套餐","豆腐煲套餐",150]];
let items=JSON.parse(localStorage.getItem("posItems")||"null")||DEFAULT_ITEMS;let cart={};let active="全部";
const catsEl=document.getElementById("cats"),grid=document.getElementById("grid"),cartEl=document.getElementById("cart"),totalEl=document.getElementById("total"),cash=document.getElementById("cash"),change=document.getElementById("change");
function categories(){return["全部",...new Set(items.map(x=>x[0]))]}
function renderCats(){catsEl.innerHTML="";categories().forEach(c=>{const b=document.createElement("button");b.textContent=c;b.className=c===active?"active":"";b.onclick=()=>{active=c;renderCats();renderGrid()};catsEl.appendChild(b)});const sel=document.getElementById("newCat");sel.innerHTML="";categories().filter(x=>x!=="全部").forEach(c=>{const o=document.createElement("option");o.value=o.textContent=c;sel.appendChild(o)})}
function renderGrid(){grid.innerHTML="";items.filter(x=>active==="全部"||x[0]===active).forEach(it=>{const i=items.indexOf(it),b=document.createElement("button");b.className="item";b.innerHTML=`<span class="name">${it[1]}</span><span class="price">$${it[2]}</span>`;b.onclick=()=>add(i);grid.appendChild(b)})}
function add(i){cart[i]=(cart[i]||0)+1;renderCart()}
function total(){return Object.entries(cart).reduce((s,[i,q])=>s+items[i][2]*q,0)}
function renderCart(){const entries=Object.entries(cart).filter(([i,q])=>q>0);cartEl.innerHTML="";if(!entries.length)cartEl.innerHTML='<div class="empty">點左邊商品加入訂單</div>';entries.forEach(([i,q])=>{const it=items[i],d=document.createElement("div");d.className="row";d.innerHTML=`<div><div class="name">${it[1]}　$${it[2]}</div><div class="controls"><button data-a="-">−</button><b>${q}</b><button data-a="+">＋</button></div></div><div class="sum">$${it[2]*q}</div>`;d.querySelector('[data-a="-"]').onclick=()=>{cart[i]--;if(cart[i]<=0)delete cart[i];renderCart()};d.querySelector('[data-a="+"]').onclick=()=>{cart[i]++;renderCart()};cartEl.appendChild(d)});totalEl.textContent="$"+total();calcChange()}
function calcChange(){const t=total(),c=Number(cash.value||0);change.textContent=c>=t?`找零：$${c-t}`:`尚差：$${t-c}`}
cash.oninput=calcChange;document.getElementById("exact").onclick=()=>{cash.value=total();calcChange()};document.getElementById("clear").onclick=()=>{cart={};cash.value="";renderCart()};document.getElementById("checkout").onclick=()=>{if(!Object.keys(cart).length)return;const t=total(),c=Number(cash.value||0);if(c&&c<t){alert("收款金額不足");return}alert(`結帳完成\n總計：$${t}${c?`\n收款：$${c}\n找零：$${c-t}`:""}`);cart={};cash.value="";renderCart()};
const dlg=document.getElementById("dlg");document.getElementById("editBtn").onclick=()=>dlg.showModal();document.getElementById("cancel").onclick=()=>dlg.close();document.getElementById("save").onclick=()=>{const cat=document.getElementById("newCat").value,name=document.getElementById("newName").value.trim(),price=Number(document.getElementById("newPrice").value);if(!name||!Number.isFinite(price)||price<0){alert("請輸入品名與正確價格");return}items.push([cat,name,price]);localStorage.setItem("posItems",JSON.stringify(items));document.getElementById("newName").value="";document.getElementById("newPrice").value="";renderCats();renderGrid();dlg.close()};document.getElementById("resetMenu").onclick=()=>{if(confirm("要恢復成照片中的預設菜單嗎？自訂商品會被移除。")){items=structuredClone(DEFAULT_ITEMS);localStorage.setItem("posItems",JSON.stringify(items));cart={};active="全部";renderCats();renderGrid();renderCart()}};
renderCats();renderGrid();renderCart();
</script>
</body>
</html>
